<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <defs>
    <filter id="pixel-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="0" flood-color="#E0E0E0" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="32" y="32" width="448" height="448" rx="64" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="8" filter="url(#pixel-shadow)" />

  <!-- Pixel Layers -->
  <g id="pixel-fills" fill="#FFA033">
    <rect x="336" y="96" width="48" height="16" />
    <rect x="320" y="112" width="80" height="16" />
    <rect x="320" y="128" width="16" height="16" /><rect x="384" y="128" width="16" height="16" />
    <rect x="320" y="144" width="16" height="16" /><rect x="384" y="144" width="16" height="16" />
    <rect x="320" y="160" width="16" height="16" /><rect x="384" y="160" width="16" height="16" />
    <rect x="336" y="176" width="48" height="16" />
    <rect x="352" y="192" width="16" height="16" />
    <rect x="176" y="256" width="32" height="32" />
    <rect x="352" y="336" width="32" height="32" />
    <rect x="128" y="320" width="48" height="16" />
    <rect x="128" y="336" width="16" height="16" /><rect x="160" y="336" width="16" height="16" />
    <rect x="128" y="352" width="48" height="16" />
    <rect x="144" y="368" width="16" height="16" />
  </g>

  <g id="pixel-outlines" fill="#C85A00">
    <rect x="336" y="80" width="48" height="16" />
    <rect x="320" y="96" width="16" height="16" /><rect x="384" y="96" width="16" height="16" />
    <rect x="304" y="112" width="16" height="16" /><rect x="400" y="112" width="16" height="16" />
    <rect x="304" y="128" width="16" height="16" /><rect x="336" y="128" width="48" height="16" /><rect x="400" y="128" width="16" height="16" />
    <rect x="304" y="144" width="16" height="16" /><rect x="336" y="144" width="16" height="16" /><rect x="400" y="144" width="16" height="16" />
    <rect x="304" y="160" width="16" height="16" /><rect x="336" y="160" width="48" height="16" /><rect x="400" y="160" width="16" height="16" />
    <rect x="320" y="176" width="16" height="16" /><rect x="384" y="176" width="16" height="16" />
    <rect x="336" y="192" width="16" height="16" /><rect x="368" y="192" width="16" height="16" />
    <rect x="352" y="208" width="16" height="16" />
    <!-- Dotted S-Path -->
    <rect x="208" y="224" width="16" height="16" /><rect x="240" y="224" width="16" height="16" /><rect x="272" y="224" width="16" height="16" /><rect x="304" y="224" width="16" height="16" />
    <rect x="176" y="240" width="32" height="16" />
    <rect x="160" y="256" width="16" height="32" /><rect x="208" y="256" width="16" height="32" />
    <rect x="176" y="288" width="32" height="16" />
    <rect x="224" y="304" width="16" height="16" /><rect x="256" y="304" width="16" height="16" /><rect x="288" y="304" width="16" height="16" /><rect x="320" y="304" width="16" height="16" />
    <rect x="352" y="320" width="32" height="16" />
    <rect x="336" y="336" width="16" height="32" /><rect x="384" y="336" width="16" height="32" />
    <rect x="352" y="368" width="32" height="16" />
    <rect x="208" y="384" width="16" height="16" /><rect x="240" y="384" width="16" height="16" /><rect x="272" y="384" width="16" height="16" /><rect x="304" y="384" width="16" height="16" />
    <!-- Bottom Pin Outlines -->
    <rect x="128" y="304" width="48" height="16" />
    <rect x="112" y="320" width="16" height="16" /><rect x="176" y="320" width="16" height="16" />
    <rect x="112" y="336" width="16" height="16" /><rect x="144" y="336" width="16" height="16" /><rect x="176" y="336" width="16" height="16" />
    <rect x="112" y="352" width="16" height="16" /><rect x="176" y="352" width="16" height="16" />
    <rect x="128" y="368" width="16" height="16" /><rect x="160" y="368" width="16" height="16" />
    <rect x="144" y="384" width="16" height="16" />
  </g>

  <g id="pixel-details" fill="#FFFFFF">
    <rect x="352" y="128" width="32" height="48" />
    <rect x="144" y="336" width="16" height="16" />
  </g>
</svg>
